{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h3 class="text-center mb-3">System Login</h3>
        <div class="card p-4 shadow-sm">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 mt-2">Log In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
