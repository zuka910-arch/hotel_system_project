<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hotel System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> 


<nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Log In">🏨 Hotel Dashboard</a>
        
        <ul class="navbar-nav ms-auto"> 
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <span class="navbar-text me-3">Ciao, {{ user.username }}!</span> 
                </li>
                <!-- log out-->
                <li class="nav-item">
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="nav-link bg-transparent border-0">Log Out</button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">Log In</a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock content %}
    </div>

</body>
</html>
