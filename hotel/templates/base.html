<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hotel System{% endblock %}</title>
    <!-- ბუტსტრაპის ჩართვა -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> <!-- bg-light: ღია ნაცრისფერი ფონი მთელ გვერდზე -->

    <!-- ნავიგაცია: bg-dark (შავი ფონი), navbar-dark (თეთრი ტექსტი) -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🏨 Hotel Dashboard</a>
            
            <ul class="navbar-nav ms-auto"> <!-- ms-auto: Margin Start Auto (ყველაფერს აგდებს მარჯვნივ) -->
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <span class="navbar-text me-3">Ciao, {{ user.username }}!</span> <!-- me-3: მარჯვნივ ტოვებს დაშორებას -->
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="#">Log In</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <!-- მთავარი კონტეინერი: mt-4 (დაშორება ზემოდან 4) -->
    <div class="container mt-4">
        {% block content %}
        {% endblock content %}
    </div>

</body>
</html>
